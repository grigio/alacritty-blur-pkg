name: Build Arch packages

on:
  push:
    branches: [master, main]
    paths:
      - 'PKGBUILD'
      - 'winit-ext-background-effect.patch'
      - 'alacritty-scroll-velocity.patch'
      - '.github/workflows/build.yml'
  workflow_dispatch:
  # No schedule on purpose: every source here is pinned (alacritty tag, winit
  # .crate, patch), so a rebuild would produce the same package. Rebuild by
  # pushing a PKGBUILD/patch change or from the Actions tab.

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Base packages + unprivileged build user
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git zstd
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder

      - uses: actions/checkout@v7

      - name: Hand the workspace to the build user
        run: chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build + install alacritty-blur
        run: su builder -c 'HOME=/home/builder makepkg -sCi --noconfirm'

      - name: Show packages
        run: ls -l *.pkg.tar.zst

      # Guards the reason this package exists: the binary must really carry the
      # ext-background-effect-v1 client code (i.e. the winit backport was
      # applied and linked), while keeping the KDE fallback.
      - name: Sanity check the package (protocol + real install)
        run: |
          set -euo pipefail
          shopt -s nullglob

          pkgs=(alacritty-blur-*.pkg.tar.zst)
          test "${#pkgs[@]}" -gt 0 || { echo "::error::no package built"; exit 1; }

          # -- inspect the packaged binary, not the container's installed copy
          tmp=$(mktemp -d)
          for p in "${pkgs[@]}"; do
            case "$p" in *-debug-*) continue;; esac
            bsdtar -xf "$p" -C "$tmp"
          done
          bin="$tmp/usr/bin/alacritty"
          test -x "$bin" || { echo "::error::package ships no /usr/bin/alacritty"; exit 1; }

          for sym in ext_background_effect_manager_v1 get_background_effect set_blur_region; do
            if ! grep -aq "$sym" "$bin"; then
              echo "::error::binary is missing '$sym' - winit backport not applied?"
              exit 1
            fi
          done
          grep -aq org_kde_kwin_blur_manager "$bin" \
            || { echo "::error::KDE org_kde_kwin_blur fallback is gone"; exit 1; }
          echo "protocol markers OK"

          # -- the inertial-scrolling patch must be in too: only
          # alacritty-scroll-velocity.patch documents `scrolling.velocity`
          man5=$(find "$tmp/usr/share/man/man5" -name 'alacritty.5*' | head -n1)
          test -n "$man5" || { echo "::error::alacritty.5 man page missing"; exit 1; }
          case "$man5" in
            *.zst) man_txt=$(zstd -dc "$man5") ;;
            *.gz)  man_txt=$(gzip -dc "$man5") ;;
            *.xz)  man_txt=$(xz -dc "$man5") ;;
            *)     man_txt=$(cat "$man5") ;;
          esac
          printf '%s' "$man_txt" | grep -q 'velocity' \
            || { echo "::error::man page lacks 'scrolling.velocity' - scroll-velocity patch not applied?"; exit 1; }
          echo "inertial scrolling marker OK"

          # -- and the option must be compiled in: the velocity config field
          # shows up in the binary's config-error strings.
          grep -aq 'Config error: velocity' "$bin" \
            || { echo "::error::binary has no scrolling.velocity config field - scroll-velocity patch not compiled in?"; exit 1; }
          echo "velocity config field OK"
          rm -rf "$tmp"

          # -- the local guards on top of PR #9008 must have survived the patch
          # application: four comments in event.rs (is_active redraw loop,
          # direction tracking, first-tick + sub-ms stop race). Without them
          # momentum either never starts or spins the redraw loop forever.
          ev=src/alacritty-0.17.0/alacritty/src/event.rs
          test -f "$ev" || { echo "::error::applied source missing: $ev"; exit 1; }
          guards=$(grep -c 'top of PR #9008' "$ev" || true)
          test "$guards" -eq 4 \
            || { echo "::error::expected 4 local-guard comments in $ev, found $guards - a guard was lost in a patch refresh"; exit 1; }
          echo "local guards OK ($guards)"

          # -- end to end: makepkg -i installed it, it runs, it claims alacritty
          pacman -Q alacritty-blur
          pacman -Qi alacritty-blur | grep -q 'Provides.*alacritty=' \
            || { echo "::error::package must provide 'alacritty'"; exit 1; }
          pacman -Qi alacritty-blur | grep -q 'Conflicts With.*alacritty' \
            || { echo "::error::package must conflict with 'alacritty'"; exit 1; }
          alacritty --version

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: arch-packages
          path: '*.pkg.tar.zst'
          if-no-files-found: error
          retention-days: 30

      - name: Publish packages to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # One release per built version, tagged v<pkgver>-<pkgrel>; a rebuild of
        # the same version refreshes the existing assets instead of duplicating.
        run: |
          set -euo pipefail
          shopt -s nullglob
          pacman -S --noconfirm github-cli

          ver=""
          for f in alacritty-blur-*.pkg.tar.zst; do
            case "$f" in *-debug-*) continue;; esac
            ver="${f#alacritty-blur-}"; ver="${ver%-x86_64.pkg.tar.zst}"; break
          done
          test -n "$ver" || { echo "no alacritty-blur package found"; exit 1; }
          tag="v$ver"

          # The heredoc body is indented like the rest of the script: YAML
          # strips the block scalar's 10 spaces, so the shell sees it at column 0.
          # Unquoted delimiter expands $ver; backticks are backslash-escaped.
          notes=$(cat <<MDEOF
          Automatic build of alacritty with \`ext-background-effect-v1\` blur.

          alacritty \`$ver\` built against a winit 0.30.13 with the protocol backported from winit master (it prefers \`ext-background-effect-v1\`, falls back to KDE's \`org_kde_kwin_blur\`), so \`[window] blur = true\` reaches labwc-blur.

          Install:

          \`\`\`sh
          sudo pacman -U alacritty-blur-*.pkg.tar.zst
          \`\`\`

          It \`provides\` and \`conflicts with\` \`alacritty\` — answer **yes** if pacman asks to remove it. Back to stock: \`sudo pacman -S alacritty\`.

          Config (\`~/.config/alacritty/alacritty.toml\`):

          \`\`\`toml
          [window]
          opacity = 0.9
          blur = true
          \`\`\`

          It also ships inertial scrolling (alacritty PR #9008, closes #4175) — add to the same file:

          \`\`\`toml
          [scrolling]
          velocity = "On"
          \`\`\`
          MDEOF
          )

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag exists, refreshing notes + assets"
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --notes "$notes" --latest
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
              alacritty-blur-*.pkg.tar.zst
          else
            echo "Creating release $tag"
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "alacritty-blur $ver" --notes "$notes" --latest \
              alacritty-blur-*.pkg.tar.zst
          fi
